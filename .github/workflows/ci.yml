name: Canonical contract validation
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install '.[validation]' pytest==8.4.1 build==1.3.0 setuptools==80.9.0 wheel==0.45.1
      - run: python -m pytest -q
      - run: python tools/build.py --outdir /tmp/sdk-a
      - run: python tools/build.py --outdir /tmp/sdk-b
      - run: cmp /tmp/sdk-a/*.whl /tmp/sdk-b/*.whl
      - run: git diff --check
